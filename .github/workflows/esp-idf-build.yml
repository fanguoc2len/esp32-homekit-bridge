name: ESP-IDF Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          set-safe-directory: true

      - name: Fetch ESP HomeKit SDK
        run: |
          sdk_revision=676fabac4a4a05184be020611cb069faa0016411
          git clone --filter=blob:none --no-checkout https://github.com/espressif/esp-homekit-sdk.git /opt/esp-homekit-sdk
          git -C /opt/esp-homekit-sdk checkout "$sdk_revision"
          git -C /opt/esp-homekit-sdk submodule update --init --recursive --depth 1

      - name: Secret scan
        run: |
          python3 scripts/check_no_secrets.py

      - name: Build LED preset
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          export ESP_HOMEKIT_SDK_PATH=/opt/esp-homekit-sdk
          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.led_demo.defaults"
          idf.py -B build-led -DSDKCONFIG=/tmp/doan2-led.sdkconfig set-target esp32
          idf.py -B build-led -DSDKCONFIG=/tmp/doan2-led.sdkconfig build

      - name: Build fan preset
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          export ESP_HOMEKIT_SDK_PATH=/opt/esp-homekit-sdk
          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.fan_demo.defaults"
          idf.py -B build-fan -DSDKCONFIG=/tmp/doan2-fan.sdkconfig set-target esp32
          idf.py -B build-fan -DSDKCONFIG=/tmp/doan2-fan.sdkconfig build

      - name: Build NeoPixel preset
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          export ESP_HOMEKIT_SDK_PATH=/opt/esp-homekit-sdk
          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.led_demo.defaults;sdkconfig.neopixel_demo.defaults"
          idf.py -B build-neopixel -DSDKCONFIG=/tmp/doan2-neopixel.sdkconfig set-target esp32
          idf.py -B build-neopixel -DSDKCONFIG=/tmp/doan2-neopixel.sdkconfig build
